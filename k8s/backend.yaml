apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: learndevops
type: Opaque
stringData:
  JWT_SECRET: dev-only-change-this-secret
  JWT_EXPIRES_IN: 1d

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: learndevops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: aliusman713/learndevopswithus-backend:75d4adb2eae1908dbdca7372ba5ad80316421f42

          imagePullPolicy: Always

          ports:
            - containerPort: 5100

          env:
            - name: PORT
              value: "5100"

            - name: DB_HOST
              value: postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET

            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_EXPIRES_IN

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5100
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5100
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: learndevops
spec:
  selector:
    app: backend

  ports:
    - port: 5100
      targetPort: 5100

  type: ClusterIP
