name: Build Security and Publish

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # =========================================================
  # GATE 5 - DOCKER BUILD
  # =========================================================
  build:
    name: Gate 5 - Docker Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            image: learndevopswithus-backend

          - name: frontend
            context: ./frontend
            image: learndevopswithus-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ matrix.image }}:${{ github.sha }} \
            ${{ matrix.context }}

      - name: Save Docker image
        run: |
          docker save \
            ${{ matrix.image }}:${{ github.sha }} \
            -o ${{ matrix.name }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.name }}
          path: ${{ matrix.name }}.tar
          retention-days: 1


  # =========================================================
  # GATE 6 - TRIVY CONTAINER SCAN
  # =========================================================
  trivy:
    name: Gate 6 - Trivy Container Scan
    runs-on: ubuntu-latest

    needs: build

    strategy:
      matrix:
        project:
          - backend
          - frontend

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.project }}

      - name: Load Docker image
        run: |
          docker load \
            --input ${{ matrix.project }}.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: learndevopswithus-${{ matrix.project }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH


  # =========================================================
  # GATE 7 - DOCKER HUB PUSH
  # =========================================================
  push:
    name: Gate 7 - Push to Docker Hub
    runs-on: ubuntu-latest

    needs: trivy

    # Push ONLY after a successful scan on main.
    # Pull requests will build and scan but will NOT publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        project:
          - backend
          - frontend

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ matrix.project }}

      - name: Load Docker image
        run: |
          docker load \
            --input ${{ matrix.project }}.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag \
            learndevopswithus-${{ matrix.project }}:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/learndevopswithus-${{ matrix.project }}:${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/learndevopswithus-${{ matrix.project }}:${{ github.sha }}
