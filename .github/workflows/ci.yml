name: LearnDevopswithUsman CI Security Gates

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # =========================================================
  # GATE 1 - SECRET SCANNING
  # =========================================================
  gitleaks:
    name: Gate 1 - Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================================================
  # GATE 2 - LINT
  # =========================================================
  lint:
    name: Gate 2 - ESLint
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      matrix:
        project:
          - frontend
          - backend

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0


  # =========================================================
  # GATE 3 - SAST
  # =========================================================
  sast:
    name: Gate 3 - Semgrep SAST
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/typescript


  # =========================================================
  # GATE 4 - SCA
  # =========================================================
  sca:
    name: Gate 4 - npm SCA
    runs-on: ubuntu-latest
    needs: sast

    strategy:
      matrix:
        project:
          - frontend
          - backend

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high
